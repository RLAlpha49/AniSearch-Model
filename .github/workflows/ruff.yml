name: Ruff
on: [push, pull_request]
jobs:
    ruff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Run Ruff Check
              uses: astral-sh/ruff-action@v3
              with:
                  args: "check"
            - name: Run Ruff Format
              uses: astral-sh/ruff-action@v3
              with:
                  args: "format --check"
