site_name: AniSearch-Model
site_url: https://rlalpha49.github.io/AniSearch-Model
site_description: AniSearch Model leverages cross-encoder transformer models to match descriptions with anime and manga titles through semantic search.
site_author: RLAlpha49
repo_url: https://github.com/RLAlpha49/AniSearch-Model
repo_name: RLAlpha49/AniSearch-Model
copyright: >
  Copyright &copy; 2025 RLAlpha49 under the MIT License –
  <a href="#__consent">Change cookie settings</a>
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RLAlpha49
    - icon: fontawesome/brands/discord
      link: https://discordapp.com/users/251479989378220044
  analytics:
    provider: google
    property: G-D5XNSQW23M
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
  consent:
    title: Cookie consent
    actions:
      - accept
      - reject
      - manage
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

plugins:
  - search
  - open-in-new-tab
  - mermaid2
  - minify:
      minify_html: true
  - panzoom:
      full_screen: True
      always_show_hint: True
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
  - git-committers:
      repository: RLAlpha49/AniSearch-Model
      branch: main
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true
            heading_level: 3
            show_if_no_docstring: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_signatures: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            docstring_options:
              ignore_init_summary: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Usage Guide: usage.md
    - Examples: examples.md
  - Concepts:
    - Models & Architecture: models.md
    - Datasets: datasets.md
  - API Reference:
    - Main Module: api/main.md
    - Models: api/models.md
    - Training: api/training.md
    - CLI Components: api/cli.md 
    - Utilities: api/utils.md
    - Dataset Merging: api/merge_datasets.md
  - Development:
    - Contributing: contributing.md

theme:
  name: material
  font:
    text: Fira Sans
    code: Fira Code
  icon:
    repo: fontawesome/brands/git-alt
    annotation: material/plus-circle
    edit: material/pencil
    view: material/eye
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - search
    - search.suggest
    - search.highlight
    - search.share
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.top
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - content.action.view
    - content.tooltips
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - header.autohide
    - navigation.footer
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - def_list
  - attr_list
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - tables
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - md_in_html